[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testio"
version = "0.2.0"
description = "Run programs against expected-output test suites: grading, CI checks and exams"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Adam Djellouli" }]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Education",
  "Topic :: Software Development :: Testing",
  "Framework :: FastAPI",
]
# Ranges here; exact pins for reproducible deployments live in requirements.txt.
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30",
  "python-multipart>=0.0.18",
  "Jinja2>=3.1.6,<4",
  "python-json-logger>=2.0",
]

[project.optional-dependencies]
pdf = ["weasyprint>=60"]
dev = [
  "bandit>=1.7",
  "black>=26,<27",
  "build>=1.2",
  "httpx>=0.27",
  "hypothesis>=6.0",
  "isort>=5.13",
  "jsonschema>=4.18",
  "pip-audit>=2.7",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.15,<0.16",
]

[project.urls]
Homepage = "https://github.com/djeada/Testio"
Issues = "https://github.com/djeada/Testio/issues"

[project.scripts]
testio = "testio.apps.cli.main:main"
testio-server = "testio.apps.server.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["testio*"]

[tool.setuptools.package-data]
"testio.apps.server" = ["templates/*.html", "static/**/*"]
"testio" = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
target-version = ["py310", "py311", "py312", "py313"]

[tool.isort]
profile = "black"

[tool.ruff]
target-version = "py310"

[tool.coverage.run]
source = ["testio"]
branch = true

[tool.coverage.report]
skip_empty = true
