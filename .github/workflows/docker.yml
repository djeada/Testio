name: Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up QEMU
      if: github.event_name == 'release'
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build image for smoke test
      uses: docker/build-push-action@v7
      with:
        context: .
        load: true
        tags: testio:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Smoke test container
      run: |
        docker run -d --name testio -p 8000:8000 -e TESTIO_TEACHER_API_KEY=ci-key testio:ci
        for i in $(seq 1 30); do
          curl -fsS http://127.0.0.1:8000/livez && break
          sleep 1
        done
        curl -fsS http://127.0.0.1:8000/livez
        docker exec testio sh -c 'test "$(id -u)" != 0'
        docker logs testio
        docker rm -f testio

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
    - name: Build and push
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: ${{ github.event_name == 'release' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
